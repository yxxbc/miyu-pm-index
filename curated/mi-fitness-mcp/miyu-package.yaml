# Example descriptor for https://github.com/binglua/mi-fitness-mcp-cn
# Not yet published upstream; values reflect the local installation.
name: mi-fitness
display_name: 小米手环健康数据
description: Read Xiaomi Mi Fitness health data through a local MCP server, including daily activity, heart rate, sleep, workouts and body measurements.
type: mcp
version: 0.1.0
license: MIT
homepage: https://github.com/binglua/mi-fitness-mcp-cn
topics:
  - miyu-mcp
  - miyu-package

install:
  method: git
  runtime: python
  setup:
    - python3 -m venv .venv
    - .venv/bin/pip install -e .

mcp:
  id: mi-fitness
  command: "{root}/.venv/bin/mi-fitness-mcp"
  args:
    - serve
  env: {}
  timeout_seconds: 60
