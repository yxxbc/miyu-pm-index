name: collect-registry

on:
  schedule:
    # 每天 UTC 02:00 自动扫描
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Collect and generate index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python tools/collect.py
          --schema schemas/miyu-package.schema.json
          --out .
          --summary-file "${RUNNER_TEMP}/pr-summary.json"

      - name: Create or update auto PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "no index changes"
            exit 0
          fi
          git config user.name "miyu-pm bot"
          git config user.email "miyu-pm[bot]@users.noreply.github.com"
          BRANCH="miyu-pm-bot/collect"
          git checkout -B "$BRANCH"
          git add .
          git commit -m "chore: refresh package index [skip ci]" || true
          git push --force-with-lease -u origin "$BRANCH" || git push --force -u origin "$BRANCH"

          SUMMARY="${RUNNER_TEMP}/pr-summary.json"
          TITLE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["title"])' "$SUMMARY")"
          BODY="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["body"])' "$SUMMARY")"

          PR_URL="$(gh pr list --head "$BRANCH" --json url -q '.[0].url' 2>/dev/null || true)"
          if [ -n "$PR_URL" ]; then
            echo "auto PR already exists: $PR_URL"
            gh pr edit "$PR_URL" --title "$TITLE" --body "$BODY"
          else
            PR_URL="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY")"
          fi

          if [ -n "$PR_URL" ]; then
            gh pr merge "$PR_URL" --merge --delete-branch
            echo "auto-merged: $PR_URL"
          fi
